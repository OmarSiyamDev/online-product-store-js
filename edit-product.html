<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Edit Product</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>

<body>
  <header class="header">
    <div class="container header-content">
      <h1>Edit Product</h1>
      <a href="index.html" class="btn secondary-btn">Back to Products</a>
    </div>
  </header>

  <main class="container form-container">
    <form id="productForm">
      <div class="form-group">
        <label for="name">Product Name</label>
        <input type="text" id="name"/>
        <small class="field-error" id="nameError"></small>
      </div>

      <div class="form-group">
        <label for="category">Category</label>
        <select id="category">
          <option value="">Select Category</option>
          <option value="computers">Computers</option>
          <option value="electronics">Electronics</option>
          <option value="audio">Audio</option>
        </select>
        <small class="field-error" id="categoryError"></small>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" rows="5"></textarea>
        <small class="field-error" id="descriptionError"></small>
      </div>

      <div class="form-group">
        <label for="price">Price</label>
        <input type="text" id="price" placeholder="$1200.00"/>
        <small class="field-error" id="priceError"></small>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="available"/>
        <label for="available">Product is available</label>
      </div>

      <button type="submit" class="btn primary-btn">Update Product</button>
    </form>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
